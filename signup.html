<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReMa — Sign up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --page: #E6ECE1;
    --surface: #F4F6F1;
    --panel: #C8CDC1;
    --ink: #16211A;
    --ink-soft: #6B7566;
    --green: #43664A;
    --green-deep: #2E4A34;
    --line: #D6DACF;
    --dark: #1D2620;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    font-family:var(--font-body);
    background:var(--page);
    color:var(--ink);
    padding:28px;
  }
  .frame{ max-width:1000px; margin:0 auto; }
  h1.page-title{
    font-family:var(--font-heading);
    font-weight:500;
    font-size:26px;
    color:#7A8574;
    margin-bottom:18px;
    padding-left:6px;
  }
  .card{
    display:grid;
    grid-template-columns: 0.85fr 1.15fr;
    background:var(--surface);
    border-radius:16px;
    overflow:hidden;
    min-height:640px;
  }

  .visual-panel{
    position:relative;
    background:var(--panel);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .cluster{ position:relative; width:260px; height:300px; }
  .shape{ position:absolute; }
  .sphere-top{
    width:60px; height:60px; border-radius:50%;
    top:10px; left:60px;
    background:radial-gradient(circle at 32% 30%, #ffffff, #cfd3c8 70%);
    box-shadow: inset -6px -8px 14px rgba(0,0,0,0.08);
  }
  .cone-teal{
    width:0; height:0;
    border-left:26px solid transparent;
    border-right:26px solid transparent;
    border-bottom:46px solid #2E5C4E;
    top:52px; left:8px;
    transform:rotate(-18deg);
  }
  .cone-coral{
    width:0; height:0;
    border-left:30px solid transparent;
    border-right:30px solid transparent;
    border-bottom:66px solid #C4453F;
    top:38px; right:16px;
    transform:rotate(20deg);
  }
  .swoop{
    width:150px; height:70px;
    top:80px; left:38px;
    border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
    background:linear-gradient(120deg, #F2EFE6 0%, #EBB9A6 42%, #D65B45 70%, #7A3A2E 100%);
    transform:rotate(-8deg);
  }
  .phone{
    width:150px; height:190px;
    top:100px; left:44px;
    border-radius:20px;
    background:linear-gradient(160deg, #33414A 0%, #171E24 60%);
    box-shadow:0 18px 30px rgba(0,0,0,0.18);
  }
  .sphere-bottom{
    width:78px; height:78px; border-radius:50%;
    top:200px; left:16px;
    background:radial-gradient(circle at 30% 28%, #ffffff, #DAD9CE 75%);
    box-shadow: inset -8px -10px 16px rgba(0,0,0,0.08);
  }
  .mat{
    width:170px; height:60px;
    top:236px; left:44px;
    border-radius:50%;
    background:repeating-linear-gradient(100deg, #C9A46B 0 4px, #B98F53 4px 8px);
    transform:rotate(-6deg);
  }
  .cylinder{
    width:44px; height:120px;
    top:210px; left:150px;
    border-radius:22px;
    background:linear-gradient(100deg, #B9713E 0%, #8C4E27 55%, #6B3A1C 100%);
  }
  .disc{
    width:70px; height:70px; border-radius:50%;
    top:258px; left:190px;
    background:radial-gradient(circle at 35% 30%, #E9E5DC, #B7B2A6 80%);
  }
  .pebble{
    width:36px; height:36px; border-radius:50%;
    top:270px; left:30px;
    background:radial-gradient(circle at 30% 30%, #ffffff, #C9CFC2 80%);
  }

  .form-panel{
    padding:44px 56px 40px;
    display:flex;
    flex-direction:column;
  }
  .form-title{
    font-family:var(--font-heading);
    font-weight:500;
    font-size:22px;
    margin-bottom:4px;
  }
  .form-sub{
    font-size:13px;
    color:var(--ink-soft);
    margin-bottom:24px;
  }

  .tabs{
    display:flex;
    background:var(--line);
    border-radius:8px;
    padding:4px;
    margin-bottom:28px;
    width:260px;
  }
  .tab{
    flex:1;
    text-align:center;
    padding:9px 0;
    font-size:13.5px;
    font-weight:600;
    color:var(--ink-soft);
    border-radius:6px;
    cursor:pointer;
    transition:background .2s ease, color .2s ease;
    border:none;
    font-family:var(--font-ui);
    background:none;
  }
  .tab.active{
    background:var(--dark);
    color:#fff;
  }

  .field-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:0 24px;
  }
  .field{
    border-bottom:1px solid var(--line);
    padding:11px 4px;
    margin-bottom:6px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .field.full{ grid-column:1 / -1; }
  .field input{
    flex:1;
    border:none;
    outline:none;
    font-family:var(--font-ui);
    font-size:13.5px;
    background:none;
    color:var(--ink);
  }
  .field input::placeholder{ color:#9AA292; }
  .eye-btn{
    background:none; border:none; cursor:pointer;
    color:#9AA292; display:flex; align-items:center;
  }

  .agree{
    display:flex;
    align-items:flex-start;
    gap:8px;
    margin:14px 0 22px;
    font-size:12.5px;
    color:var(--ink-soft);
    line-height:1.5;
  }
  .agree input{ margin-top:3px; }
  .agree a{ color:var(--green-deep); font-weight:600; text-decoration:none; }
  .agree a:hover{ text-decoration:underline; }

  .action-row{
    display:flex;
    gap:14px;
    margin-bottom:20px;
  }
  .create-btn{
    flex:1.2;
    background:var(--green);
    color:#fff;
    border:none;
    font-family:var(--font-ui);
    font-size:14.5px;
    font-weight:600;
    padding:13px;
    border-radius:8px;
    cursor:pointer;
    transition:background .2s ease;
  }
  .create-btn:hover{ background:var(--green-deep); }
  .google-btn{
    flex:1;
    background:var(--dark);
    color:#fff;
    border:none;
    font-family:var(--font-ui);
    font-size:14px;
    font-weight:600;
    padding:13px;
    border-radius:8px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    transition:opacity .2s ease;
  }
  .google-btn:hover{ opacity:.85; }

  .signup-note{
    text-align:center;
    font-size:13px;
    color:var(--ink-soft);
  }
  .signup-note a{
    color:var(--green-deep);
    font-weight:600;
    text-decoration:none;
    margin-left:4px;
  }
  .signup-note a:hover{ text-decoration:underline; }

  [data-panel]{ display:none; }
  [data-panel].active{ display:grid; }

  @media (max-width:760px){
    body{ padding:14px; }
    .card{ grid-template-columns:1fr; }
    .visual-panel{ min-height:220px; }
    .form-panel{ padding:32px 26px; }
    .field-grid{ grid-template-columns:1fr; }
    .tabs{ width:100%; }
  }
  .mini-footer{
    max-width:1000px;
    margin:32px auto 0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:14px;
    font-size:13px;
    color:var(--ink-soft);
    padding:0 4px;
  }
  .mini-footer nav{ display:flex; gap:22px; }
  .mini-footer a{ color:var(--ink-soft); text-decoration:none; }
  .mini-footer a:hover{ color:var(--green-deep); }
  @media (max-width:640px){
    .mini-footer{ flex-direction:column; align-items:flex-start; }
  }
  @media (max-width:480px){
    body{ padding:10px; }
    .page-title{ font-size:22px; }
    .cluster{ transform:scale(0.82); }
    .form-panel{ padding:26px 20px 32px; }
    .action-row{ flex-direction:column; }
    .google-btn{ order:2; }
    .create-btn{ order:1; }
    .mini-footer nav{ gap:14px 18px; flex-wrap:wrap; }
  }

</style>
</head>
<body>
  <div class="frame">
    <a href="index.html" style="text-decoration:none;"><h1 class="page-title">Sign up</h1></a>
    <div class="card">
      <div class="visual-panel">
        <div class="cluster">
          <div class="shape cone-teal"></div>
          <div class="shape cone-coral"></div>
          <div class="shape sphere-top"></div>
          <div class="shape swoop"></div>
          <div class="shape phone"></div>
          <div class="shape mat"></div>
          <div class="shape cylinder"></div>
          <div class="shape disc"></div>
          <div class="shape sphere-bottom"></div>
          <div class="shape pebble"></div>
        </div>
      </div>

      <div class="form-panel">
        <h2 class="form-title">Create account</h2>
        <p class="form-sub">For individuals or registered companies</p>

        <div class="tabs">
          <button class="tab active" id="tab-individual" onclick="switchTab('individual')">Individual</button>
          <button class="tab" id="tab-company" onclick="switchTab('company')">Company</button>
        </div>

        <form onsubmit="return false;">
          <div class="field-grid active" data-panel="individual">
            <div class="field"><input type="text" placeholder="Full name"></div>
            <div class="field"><input type="date" placeholder="Date of birth"></div>
            <div class="field full"><input type="email" placeholder="Email address"></div>
            <div class="field"><input id="pw-ind" type="password" placeholder="Password">
              <button type="button" class="eye-btn" onclick="togglePw('pw-ind')" aria-label="Show password">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
            <div class="field"><input id="pw-ind2" type="password" placeholder="Confirm password">
              <button type="button" class="eye-btn" onclick="togglePw('pw-ind2')" aria-label="Show password">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>

          <div class="field-grid" data-panel="company">
            <div class="field"><input type="text" placeholder="Company name"></div>
            <div class="field"><input type="text" placeholder="Contact person"></div>
            <div class="field"><input type="text" placeholder="Registration number"></div>
            <div class="field"><input type="email" placeholder="Email address"></div>
            <div class="field"><input id="pw-co" type="password" placeholder="Password">
              <button type="button" class="eye-btn" onclick="togglePw('pw-co')" aria-label="Show password">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
            <div class="field"><input id="pw-co2" type="password" placeholder="Confirm password">
              <button type="button" class="eye-btn" onclick="togglePw('pw-co2')" aria-label="Show password">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>

          <label class="agree">
            <input type="checkbox" required>
            <span>I agree to ReMa's <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></span>
          </label>

          <div class="action-row">
            <button type="submit" class="create-btn">Create account</button>
            <button type="button" class="google-btn">
              <svg width="16" height="16" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.2-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 16 19 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4c-7.5 0-14 4.2-17.7 10.7z"/><path fill="#4CAF50" d="M24 44c5.4 0 10.3-2.1 14-5.5l-6.5-5.5C29.4 34.7 26.8 36 24 36c-5.2 0-9.6-3.1-11.3-7.6l-6.5 5C9.9 39.7 16.4 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.2 5.7l6.5 5.5C41.3 36.6 44 30.9 44 24c0-1.2-.1-2.4-.4-3.5z"/></svg>
              Sign up with Google
            </button>
          </div>
        </form>

        <p class="signup-note">Already have an account? <a href="#">Login</a></p>
      </div>
    </div>
  </div>
  <footer class="mini-footer">
    <p>© 2026 ReMa. All rights reserved.</p>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About Us</a>
      <a href="services.html">Services</a>
      <a href="mission-vision.html">Mission &amp; Vision</a>
      <a href="contact.html">Contact us</a>
    </nav>
  </footer>

  <script>
    function switchTab(which){
      document.getElementById('tab-individual').classList.toggle('active', which === 'individual');
      document.getElementById('tab-company').classList.toggle('active', which === 'company');
      document.querySelectorAll('[data-panel]').forEach(p => {
        p.classList.toggle('active', p.getAttribute('data-panel') === which);
      });
    }
    function togglePw(id){
      const el = document.getElementById(id);
      el.type = el.type === 'password' ? 'text' : 'password';
    }
  </script>
</body>
</html>
